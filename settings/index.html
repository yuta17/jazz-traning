<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>設定 | ジャズトレーニング</title>
    <link rel="stylesheet" href="../styles.css?v=20261007-settings" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <nav class="hero-links" aria-label="ページ"><a href="../">ホーム</a></nav>
        <h1>設定</h1>
        <p>1周の出題数</p>
      </header>
      <section class="settings" aria-label="出題数の設定">
        <p>1〜100問で設定できます。変更は次のスタートから反映されます。</p>
        <form id="round-settings-form" class="round-settings-form">
          <label for="count-chord">コード瞬間判定</label>
          <input id="count-chord" name="chord-flash" type="number" min="1" max="100" step="1" required inputmode="numeric" />
          <label for="count-signature">調号判定</label>
          <input id="count-signature" name="key-signature" type="number" min="1" max="100" step="1" required inputmode="numeric" />
          <label for="count-key">2-5 キー判定</label>
          <input id="count-key" name="two-five-key" type="number" min="1" max="100" step="1" required inputmode="numeric" />
          <label for="count-251">2-5-1トレーニング</label>
          <input id="count-251" name="two-five-one" type="number" min="1" max="100" step="1" required inputmode="numeric" />
          <button class="button primary wide" type="submit">保存</button>
          <button id="settings-reset" class="button soft wide" type="button">初期値に戻す</button>
        </form>
        <p id="settings-status" role="status"></p>
        <p>この端末・ブラウザに保存されます。別の端末には同期されません。ブラウザのデータを削除すると初期値に戻ります。</p>
      </section>
    </main>
    <script src="../src/training-settings.js?v=20261007-settings"></script>
    <script src="../src/settings-page.js?v=20261007-settings"></script>
  </body>
</html>
