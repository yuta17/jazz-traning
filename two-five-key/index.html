<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="II–Vのコードから解決先のキーを選ぶトレーニング"
    />
    <title>2-5 キー判定</title>
    <link rel="stylesheet" href="../styles.css?v=20260925-two-five-key" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>2-5 キー判定</h1>
        <p>2つのコードから解決先のキーを選ぼう</p>
      </header>

      <section class="settings" aria-label="出題設定">
        <div class="settings-grid">
          <fieldset class="key-mode-group">
            <legend>出題</legend>
            <label class="check-option">
              <input type="checkbox" name="mode" value="major" checked />
              <span>メジャー</span>
            </label>
            <label class="check-option">
              <input type="checkbox" name="mode" value="minor" />
              <span>マイナー</span>
            </label>
          </fieldset>
        </div>

        <div class="settings-actions">
          <button id="two-five-key-start-button" class="button primary" type="button">
            スタート
          </button>
        </div>
      </section>

      <section class="practice" aria-label="出題">
        <div class="progress-row progress-count-only">
          <strong id="two-five-key-progress-count">0 / 12</strong>
        </div>

        <div
          id="two-five-key-question-panel"
          class="question-panel signature-panel"
          aria-live="polite"
        >
          <div class="ready-state">
            <strong>待機中</strong>
          </div>
        </div>

        <div class="practice-actions signature-actions">
          <div
            id="two-five-key-choice-grid"
            class="signature-choice-grid"
            aria-label="回答"
          ></div>
          <button
            id="two-five-key-next-button"
            class="button primary wide"
            type="button"
            hidden
          >
            次へ
          </button>
        </div>
      </section>
    </main>

    <script src="../src/daily-progress.js?v=20260925-two-five-key"></script>
    <script src="../src/theory.js?v=20260925-triangle7"></script>
    <script src="../src/two-five-key.js?v=20260925-two-five-key"></script>
  </body>
</html>
