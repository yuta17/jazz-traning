<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ランダムなdim7コードを弾けるか確認するトレーニング"
    />
    <title>dim7 Training</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero dim-hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">Home</a>
        </nav>
        <h1>dim7 TRAINING</h1>
        <p>すぐ押さえられるか確認しよう</p>
      </header>

      <section class="settings dim-start" aria-label="開始">
        <button id="dim-start-button" class="button primary" type="button">
          スタート
        </button>
      </section>

      <section class="practice" aria-label="出題">
        <div class="progress-row">
          <span>PROGRESS</span>
          <strong id="dim-progress-count">0 / 12</strong>
        </div>

        <div id="dim-question-panel" class="question-panel" aria-live="polite">
          <div class="ready-state">
            <p>Chord</p>
            <strong>Ready</strong>
          </div>
        </div>

        <div class="practice-actions">
          <button id="dim-reveal-button" class="button primary wide" type="button" disabled>
            構成音を見る
          </button>
          <div id="dim-answer-buttons" class="answer-buttons" hidden>
            <button id="dim-miss-button" class="button soft" type="button">
              もたついた
            </button>
            <button id="dim-hit-button" class="button success" type="button">
              弾けた
            </button>
          </div>
        </div>
      </section>

      <section class="stats" aria-labelledby="dim-stats-title">
        <div class="section-heading stats-heading">
          <h2 id="dim-stats-title">学習成績</h2>
          <span>※1周12問</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>CHORD</th>
                <th>出題</th>
                <th>成功</th>
                <th>成功率</th>
              </tr>
            </thead>
            <tbody id="dim-stats-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="../src/dim7.js"></script>
  </body>
</html>
