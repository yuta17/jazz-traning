<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="12キーを均一に回すジャズ2-5-1トレーニング"
    />
    <title>2-5-1トレーニング</title>
    <link rel="stylesheet" href="../styles.css?v=20260610-daily" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>2-5-1トレーニング</h1>
        <p>スッと弾けるまで繰り返そう</p>
      </header>

      <section class="settings" aria-label="バリエーション設定">
        <div class="settings-grid">
          <fieldset class="variation-group">
            <legend>メジャー</legend>
            <label class="check-option">
              <input type="checkbox" name="major" value="RRR" />
              <span>RRR</span>
            </label>
            <label class="check-option">
              <input type="checkbox" name="major" value="R2R" checked />
              <span>R2R</span>
            </label>
            <label class="check-option">
              <input type="checkbox" name="major" value="2R2" checked />
              <span>2R2</span>
            </label>
          </fieldset>

          <fieldset class="variation-group">
            <legend>マイナー</legend>
            <label class="check-option">
              <input type="checkbox" name="minor" value="RRR" />
              <span>RRR</span>
            </label>
            <label class="check-option">
              <input type="checkbox" name="minor" value="R2R" />
              <span>R2R</span>
            </label>
            <label class="check-option">
              <input type="checkbox" name="minor" value="2R2" />
              <span>2R2</span>
            </label>
          </fieldset>
        </div>

        <div class="settings-actions">
          <button id="start-button" class="button primary" type="button">
            スタート
          </button>
        </div>
      </section>

      <section class="practice" aria-label="出題">
        <div class="progress-row">
          <span>進捗</span>
          <strong id="progress-count">0 / 12</strong>
        </div>

        <div id="question-panel" class="question-panel" aria-live="polite">
          <div class="ready-state">
            <strong>待機中</strong>
          </div>
        </div>

        <div class="practice-actions">
          <button id="reveal-button" class="button primary wide" type="button" disabled>
            正解を見る
          </button>
          <div id="answer-buttons" class="answer-buttons" hidden>
            <button id="miss-button" class="button soft" type="button">
              もたついた
            </button>
            <button id="hit-button" class="button success" type="button">
              スッと弾けた
            </button>
          </div>
        </div>
      </section>

      <section class="stats" aria-labelledby="stats-title">
        <div class="section-heading stats-heading">
          <h2 id="stats-title">学習成績</h2>
          <span>※均等に出題されます</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>キー</th>
                <th>出題</th>
                <th>正解</th>
                <th>正解率</th>
              </tr>
            </thead>
            <tbody id="stats-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="../src/daily-progress.js?v=20260707-licks"></script>
    <script src="../src/theory.js?v=20260610-daily"></script>
    <script src="../src/app.js?v=20260610-251-maj"></script>
  </body>
</html>
