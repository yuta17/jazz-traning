<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="4小節4段の譜面から2-5と2-5-1を見つけるトレーニング"
    />
    <title>2-5 Spotter</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell spotter-shell">
      <header class="hero spotter-hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="./two-five-one/">Key Training</a>
        </nav>
        <h1>2-5 SPOTTER</h1>
        <p>4段譜で反応する</p>
      </header>

      <section class="spotter-panel" aria-label="ターゲット">
        <div class="target-row">
          <span class="target-label">TARGET</span>
          <div id="target-tabs" class="target-tabs"></div>
        </div>
        <div class="chart-meta">
          <strong id="chart-title"></strong>
          <span id="chart-count"></span>
        </div>
      </section>

      <section class="chart-section" aria-label="コード進行">
        <div id="chart-grid" class="chart-grid"></div>
      </section>

      <section class="spotter-actions" aria-label="操作">
        <button id="clear-marks" class="button neutral" type="button">
          クリア
        </button>
        <button id="check-answer" class="button primary" type="button">
          答え合わせ
        </button>
        <button id="next-chart" class="button success" type="button">
          次の譜面
        </button>
      </section>

      <section id="spotter-result" class="spotter-result" aria-live="polite">
        <span>READY</span>
        <strong>-</strong>
      </section>
    </main>

    <script src="./src/progressions.js"></script>
    <script src="./src/recognition.js"></script>
  </body>
</html>
