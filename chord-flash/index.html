<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ランダムなコードネームを見てすぐ鍵盤で押さえるトレーニング"
    />
    <title>コード瞬間判定</title>
    <link rel="stylesheet" href="../styles.css?v=20260610-daily" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero chord-hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>コード瞬間判定</h1>
        <p>コードネームを反射で押さえる</p>
      </header>

      <section class="settings chord-start" aria-label="開始">
        <button id="chord-start-button" class="button primary" type="button">
          スタート
        </button>
      </section>

      <section class="practice" aria-label="出題">
        <div class="progress-row">
          <span>進捗</span>
          <strong id="chord-progress-count">0 / 12</strong>
        </div>
        <div class="progress-row chord-time-row">
          <span>残り時間</span>
          <strong id="chord-time-left">5.0</strong>
        </div>

        <div id="chord-question-panel" class="question-panel chord-panel" aria-live="polite">
          <div class="ready-state">
            <strong>待機中</strong>
          </div>
        </div>

        <div class="chord-timer" aria-hidden="true">
          <span id="chord-timer-bar"></span>
        </div>

        <div class="practice-actions chord-actions">
          <div class="answer-buttons">
            <button id="chord-miss-button" class="button soft" type="button" disabled>
              もたついた
            </button>
            <button id="chord-hit-button" class="button success" type="button" disabled>
              弾けた
            </button>
          </div>
          <button id="chord-reveal-button" class="button primary wide" type="button" disabled>
            構成音を見る
          </button>
        </div>
      </section>

      <section class="stats" aria-labelledby="chord-stats-title">
        <div class="section-heading stats-heading">
          <h2 id="chord-stats-title">学習成績</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>種類</th>
                <th>出題</th>
                <th>成功</th>
                <th>成功率</th>
              </tr>
            </thead>
            <tbody id="chord-stats-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="../src/daily-progress.js?v=20260610-daily"></script>
    <script src="../src/chord-flash.js?v=20260610-daily"></script>
  </body>
</html>
