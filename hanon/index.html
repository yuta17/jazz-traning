<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ハノン1-5から開くたびに番号をランダム表示する"
    />
    <title>ハノン番号</title>
    <link rel="stylesheet" href="../styles.css?v=20260610-hanon-simple" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero hanon-hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>ハノン番号</h1>
        <p>開くたびに1-5からひとつ出す</p>
      </header>

      <section class="hanon-stage" aria-label="ハノン番号">
        <div class="hanon-number" aria-live="polite">
          <span>番号</span>
          <strong id="hanon-number">-</strong>
        </div>
      </section>
    </main>

    <script src="../src/hanon.js?v=20260610-hanon-simple"></script>
  </body>
</html>
