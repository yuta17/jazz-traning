<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ハノン1-5から開くたびにひとつ表示する"
    />
    <title>ハノン</title>
    <link rel="stylesheet" href="../styles.css?v=20260925-hanon-videos" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero hanon-hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>ハノン</h1>
        <p>開くたびに1-5からひとつ出す</p>
      </header>

      <section class="hanon-stage" aria-label="ハノン">
        <div class="hanon-number" aria-live="polite">
          <strong id="hanon-number">-</strong>
        </div>
        <button id="hanon-done-button" class="button success hanon-done-button" type="button">
          練習した
        </button>
      </section>
      <section class="hanon-reference" aria-labelledby="hanon-reference-title">
        <h2 id="hanon-reference-title">参考動画</h2>
        <iframe
          id="hanon-video"
          title="ハノンの参考動画"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
        <a id="hanon-video-link" target="_blank" rel="noopener">YouTubeで見る</a>
      </section>
    </main>

    <script src="../src/daily-progress.js?v=20260925-hanon-videos"></script>
    <script src="../src/hanon.js?v=20260925-hanon-videos"></script>
  </body>
</html>
