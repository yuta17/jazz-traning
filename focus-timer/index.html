<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="焦点をひとつ決めて5分だけ練習するタイマー"
    />
    <title>5分間タイマー</title>
    <link rel="stylesheet" href="../styles.css?v=20260802-focus-timer" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>5分間タイマー</h1>
        <p>焦点をひとつ決める</p>
      </header>

      <section class="focus-timer-stage" aria-label="5分間タイマー">
        <div class="focus-time" id="focus-time" aria-live="polite">5:00</div>

        <p id="focus-current" class="focus-current" hidden></p>

        <form id="focus-form" class="focus-form">
          <label for="focus-input">何に焦点を合わせるか</label>
          <input
            id="focus-input"
            name="focus"
            type="text"
            autocomplete="off"
            placeholder="例: 左手の音量を揃える"
            maxlength="80"
          />
          <button id="focus-start-button" class="button primary wide" type="submit" disabled>
            開始
          </button>
        </form>

        <button id="focus-next-button" class="button primary wide" type="button" hidden>
          次のタイマー
        </button>
      </section>
    </main>

    <script src="../src/focus-timer.js?v=20260802-focus-timer"></script>
  </body>
</html>
