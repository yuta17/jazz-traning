<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="解決先のm7コードを見てAltered Scaleを弾く12キー練習" />
    <title>Altered Scale | ジャズトレーニング</title>
    <link rel="stylesheet" href="../styles.css?v=20261007-settings" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <nav class="hero-links" aria-label="ページ"><a href="../">ホーム</a></nav>
        <h1>Altered Scale</h1>
        <p>解決先のm7コードを見て弾く</p>
      </header>
      <section class="practice" aria-label="出題">
        <div class="progress-row"><span>進捗</span><strong id="altered-progress">0 / 12</strong></div>
        <div class="question-panel" aria-live="polite">
          <div class="question-state"><strong id="altered-chord" class="question-key chord-symbol"></strong></div>
          <p id="altered-status" hidden>12キー完了しました！</p>
        </div>
        <div class="practice-actions">
          <button id="altered-next" class="button success wide" type="button">弾けた</button>
          <button id="altered-restart" class="button primary wide" type="button" hidden>もう一度</button>
        </div>
      </section>
    </main>
    <script src="../src/daily-progress.js?v=20261017-altered"></script>
    <script src="../src/altered-scale.js?v=20261017-altered"></script>
  </body>
</html>
