<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ト音記号とヘ音記号の4小節譜読み・リズム認識トレーニング"
    />
    <title>譜読みトレーニング</title>
    <link rel="stylesheet" href="../styles.css?v=20260610-daily" />
  </head>
  <body>
    <main class="app-shell reading-shell">
      <header class="hero reading-hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>譜読み</h1>
        <p>拍と音符の位置を掴む</p>
      </header>

      <section class="reading-toolbar" aria-label="譜読み操作">
        <button id="reading-new" class="button primary" type="button">
          新しい譜面
        </button>
        <button id="reading-clear" class="button neutral" type="button">
          クリア
        </button>
        <button id="reading-check" class="button success" type="button">
          答え合わせ
        </button>
      </section>

      <section class="reading-stage" aria-label="譜面">
        <div id="reading-score" class="reading-score"></div>
      </section>

      <section id="reading-result" class="spotter-result" aria-live="polite">
        <span>待機中</span>
        <strong>-</strong>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js"></script>
    <script src="../src/daily-progress.js?v=20260610-daily"></script>
    <script src="../src/sight-reading.js?v=20260610-daily"></script>
  </body>
</html>
