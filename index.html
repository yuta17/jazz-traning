<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ジャズ理論とコード反応を鍛えるトレーニングアプリ"
    />
    <title>Jazz Training</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell home-shell">
      <header class="hero home-hero">
        <h1>JAZZ TRAINING</h1>
        <p>コードと進行を反射で掴む</p>
      </header>

      <section class="home-menu" aria-label="トレーニング一覧">
        <a class="home-card" href="./chord-flash/">
          <span>CHORD FLASH</span>
          <strong>コード瞬間判定</strong>
          <em>Root positionでコードネームを反射で押さえる</em>
        </a>
        <a class="home-card" href="./two-five-one/">
          <span>KEY TRAINING</span>
          <strong>2-5-1</strong>
          <em>12キーでメジャー / マイナーを反復</em>
        </a>
        <a class="home-card" href="./recognition.html">
          <span>SPOTTER</span>
          <strong>進行判定</strong>
          <em>4段譜から2-5-1 / 2-5を探す</em>
        </a>
        <a class="home-card" href="./dim7/">
          <span>CHORD CHECK</span>
          <strong>dim7</strong>
          <em>ランダムなdim7をすぐ弾けるか確認</em>
        </a>
        <a class="home-card" href="./sight-reading/">
          <span>READING</span>
          <strong>譜読み</strong>
          <em>大譜表で拍頭とリズムを確認</em>
        </a>
      </section>
    </main>
  </body>
</html>
