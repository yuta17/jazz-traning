<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ジャズ理論とコード反応を鍛えるトレーニングアプリ"
    />
    <title>ジャズトレーニング</title>
    <link rel="stylesheet" href="./styles.css?v=20260625-lick-1" />
  </head>
  <body>
    <main class="app-shell home-shell">
      <header class="hero home-hero">
        <h1>ジャズトレーニング</h1>
        <p>コードと進行を反射で掴む</p>
      </header>

      <section class="home-menu" aria-label="トレーニング一覧">
        <a class="home-card" href="./hanon/" data-training-id="hanon">
          <strong>ハノン番号</strong>
          <em>開くたびに1-5からランダム表示</em>
        </a>
        <a class="home-card" href="./oscar-peterson/" data-training-id="oscar-peterson">
          <strong>オスカーピーターソン</strong>
          <em>Jazz Exercise 1〜3を丁寧に通す</em>
        </a>
        <a class="home-card" href="./chord-flash/" data-training-id="chord-flash">
          <strong>コード瞬間判定</strong>
          <em>コードネームを反射で押さえる</em>
        </a>
        <a class="home-card" href="./key-signature/" data-training-id="key-signature">
          <strong>調号判定</strong>
          <em>♯/♭の数からメジャー / マイナーキーを答える</em>
        </a>
        <a class="home-card" href="./two-five-one/" data-training-id="two-five-one">
          <strong>2-5-1</strong>
          <em>12キーでメジャー / マイナーを反復</em>
        </a>
        <a class="home-card" href="./rootless-9th/" data-training-id="rootless-9th">
          <strong>ルートレス9th</strong>
          <em>コードから3・5・7・9の音を答える</em>
        </a>
        <a class="home-card" href="./licks/1/" data-training-id="lick-1">
          <strong>リック 1</strong>
          <em>ii-V-Iの譜例を12キーで弾く</em>
        </a>
      </section>
    </main>
    <script src="./src/daily-progress.js?v=20260625-lick-1"></script>
  </body>
</html>
