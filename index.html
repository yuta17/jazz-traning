<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ジャズ理論とコード反応を鍛えるトレーニングアプリ"
    />
    <title>ジャズトレーニング</title>
    <link rel="stylesheet" href="./styles.css?v=20260628-instagram-lick" />
  </head>
  <body>
    <main class="app-shell home-shell">
      <header class="hero home-hero">
        <h1>ジャズトレーニング</h1>
        <p>毎日ルーティン</p>
      </header>

      <section class="home-menu" aria-label="トレーニング一覧">
        <a class="home-card" href="./hanon/" data-training-id="hanon">
          <strong>ハノン</strong>
          <em>開くたびに1-5からひとつ出す</em>
        </a>
        <a class="home-card" href="./oscar-peterson/" data-training-id="oscar-peterson">
          <strong>オスカーピーターソン</strong>
          <em>Exercise 1〜3から今日の1曲</em>
        </a>
        <a class="home-card" href="./chord-flash/" data-training-id="chord-flash">
          <strong>コード瞬間判定</strong>
          <em>コードネームを反射で押さえる</em>
        </a>
        <a class="home-card" href="./key-signature/" data-training-id="key-signature">
          <strong>調号判定</strong>
          <em>♯/♭の数からメジャー / マイナーキーを答える</em>
        </a>
        <a class="home-card" href="./two-five-one/" data-training-id="two-five-one">
          <strong>2-5-1</strong>
          <em>12キーでメジャー / マイナーを反復</em>
        </a>
        <a class="home-card" href="./standard-sight-reading/" data-training-id="standard-sight-reading">
          <strong>初見スタンダード</strong>
          <em>I real Pro Jazz 1460 から今日の一曲</em>
        </a>
        <a class="home-card" href="./rootless-9th/" data-training-id="rootless-9th">
          <strong>ルートレス9th</strong>
          <em>コードから3・5・7・9の音を答える</em>
        </a>
        <a class="home-card" href="./licks/">
          <strong>リック</strong>
          <em>12キーで弾く</em>
        </a>
        <a class="home-card" href="./instagram-lick/" data-training-id="instagram-lick">
          <strong>1小節耳コピしよう</strong>
          <em>5曲から今日の1曲を出す</em>
        </a>
      </section>
    </main>
    <script src="./src/daily-progress.js?v=20260707-licks"></script>
  </body>
</html>
