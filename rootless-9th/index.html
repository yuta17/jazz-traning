<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="メジャーキーのルートレス9thの構成音を答えるトレーニング"
    />
    <title>ルートレス9th</title>
    <link rel="stylesheet" href="../styles.css?v=20260809-rootless9th" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>ルートレス9th</h1>
        <p>メジャーキーの音名を答える</p>
      </header>

      <section class="settings chord-start" aria-label="開始">
        <button id="rootless-start-button" class="button primary" type="button">
          スタート
        </button>
      </section>

      <section class="practice" aria-label="出題">
        <div class="progress-row progress-count-only">
          <strong id="rootless-progress-count">0 / 12</strong>
        </div>

        <div id="rootless-question-panel" class="question-panel rootless-panel" aria-live="polite">
          <div class="ready-state"><strong>待機中</strong></div>
        </div>

        <div class="practice-actions">
          <button id="rootless-reveal-button" class="button primary wide" type="button" disabled>
            答えを見る
          </button>
          <button id="rootless-next-button" class="button success wide" type="button" hidden>
            次へ
          </button>
        </div>
      </section>
    </main>

    <script src="../src/daily-progress.js?v=20260809-rootless9th"></script>
    <script src="../src/rootless-9th.js?v=20260809-rootless9th"></script>
  </body>
</html>
