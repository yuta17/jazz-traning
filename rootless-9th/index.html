<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="コードネームからルートレス9thの構成音を答えるトレーニング"
    />
    <title>ルートレス9th</title>
    <link rel="stylesheet" href="../styles.css?v=20260624-rootless-9th" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero chord-hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>ルートレス9th</h1>
        <p>3・5・7・9を反射で答える</p>
      </header>

      <section class="settings chord-start" aria-label="開始">
        <button id="rootless-start-button" class="button primary" type="button">
          スタート
        </button>
      </section>

      <section class="practice" aria-label="出題">
        <div class="progress-row">
          <span>進捗</span>
          <strong id="rootless-progress-count">0 / 12</strong>
        </div>

        <div id="rootless-question-panel" class="question-panel rootless-panel" aria-live="polite">
          <div class="ready-state">
            <strong>待機中</strong>
          </div>
        </div>

        <div class="practice-actions rootless-actions">
          <div class="answer-buttons">
            <button id="rootless-miss-button" class="button soft" type="button" disabled>
              もたついた
            </button>
            <button id="rootless-hit-button" class="button success" type="button" disabled>
              答えられた
            </button>
          </div>
          <button id="rootless-reveal-button" class="button primary wide" type="button" disabled>
            構成音を見る
          </button>
        </div>
      </section>

      <section class="stats" aria-labelledby="rootless-stats-title">
        <div class="section-heading stats-heading">
          <h2 id="rootless-stats-title">学習成績</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>種類</th>
                <th>出題</th>
                <th>成功</th>
                <th>成功率</th>
              </tr>
            </thead>
            <tbody id="rootless-stats-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="../src/daily-progress.js?v=20260624-rootless-9th"></script>
    <script src="../src/rootless-9th.js?v=20260624-rootless-9th"></script>
  </body>
</html>
