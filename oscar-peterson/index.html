<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Oscar Peterson Exercise 1〜3から今日の重点練習を選ぶ"
    />
    <title>オスカーピーターソン</title>
    <link rel="stylesheet" href="../styles.css?v=20260708-daily-exercise" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>オスカーピーターソン</h1>
        <p>今日の重点練習</p>
      </header>

      <section class="peterson-stage" aria-label="今日の重点練習">
        <div class="peterson-exercise">
          <span>今日の重点練習</span>
          <strong id="peterson-exercise-title">1</strong>
          <button id="peterson-done-button" class="button success peterson-done-button" type="button">
            練習した
          </button>
        </div>
      </section>

      <section class="practice-note" aria-labelledby="peterson-purpose-title">
        <h2 id="peterson-purpose-title">目的</h2>
        <p>
          毎日、Exercise 1〜3の中から1曲をランダムで選び、その曲を重点的に練習することで、ミスを減らし、演奏の安定性を高める。
        </p>
      </section>

      <section class="practice-note" aria-labelledby="peterson-note-title">
        <h2 id="peterson-note-title">練習方法</h2>

        <ol>
          <li>まず1回通して弾き、ミスしやすい箇所を確認する。</li>
          <li>ミスした箇所（2〜4拍程度）だけを切り出して、超ゆっくり5回弾く。</li>
          <li>少しテンポを上げて5回弾く。</li>
          <li>元のテンポで通して弾く。</li>
          <li>ノーミスを目指して繰り返す（3〜10回連続成功を目標）。</li>
        </ol>
      </section>
    </main>
    <script src="../src/daily-progress.js?v=20260707-licks"></script>
    <script src="../src/oscar-peterson.js?v=20260708-daily-exercise-number"></script>
  </body>
</html>
