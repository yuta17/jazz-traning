<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="All the Things You Areを日替わりのキーに移調して弾く"
    />
    <title>All the Things You Are</title>
    <link rel="stylesheet" href="../styles.css?v=20260709-all-the-things" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <nav class="hero-links" aria-label="ページ">
          <a href="../">ホーム</a>
        </nav>
        <h1>All the Things You Are</h1>
        <p>移調して弾く</p>

      <section class="daily-key-stage" aria-label="今日のキー">
        <div class="daily-key-display">
          <span>今日のキー</span>
          <strong id="all-things-key" aria-live="polite">-</strong>

        <button
          id="all-things-done-button"
          class="button success daily-key-done-button"
          type="button"
        >
          弾けた
        </button>
      </section>
    </main>

    <script src="../src/daily-progress.js?v=20260709-all-the-things"></script>
    <script src="../src/all-the-things-you-are.js?v=20260709-all-the-things"></script>
