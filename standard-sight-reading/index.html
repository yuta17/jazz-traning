<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="重要度別のジャズスタンダードから、初見練習する1曲をランダム選曲"
    />
    <title>初見スタンダード</title>
    <link rel="stylesheet" href="../styles.css?v=20260825-standard-random" />
  </head>
  <body class="standard-random-page">
    <main class="app-shell standard-shell">
      <header class="standard-hero">
        <a class="standard-home-link" href="../">ホーム</a>
        <p class="standard-kicker">SIGHT-READING SESSION</p>
        <h1>初見スタンダード</h1>
        <p class="standard-intro">カテゴリを選んで、今日のレパートリーを1曲。</p>
      </header>

      <section class="standard-picker" aria-labelledby="category-heading">
        <h2 id="category-heading">カテゴリを選ぶ</h2>
        <div class="standard-category-grid">
          <button class="standard-category-button priority" type="button" data-category="priority31">
            <strong>最優先31曲</strong><span>6 lists hit</span>
          </button>
          <button class="standard-category-button next" type="button" data-category="next47">
            <strong>次の47曲</strong><span>5 lists hit</span>
          </button>
          <button class="standard-category-button four-hit" type="button" data-category="fourHit76">
            <strong>4 hitの76曲</strong><span>4 lists hit</span>
          </button>
        </div>
      </section>

      <section class="standard-result" aria-labelledby="result-heading" aria-live="polite">
        <p id="result-heading" class="standard-result-label">今日の1曲</p>
        <div id="standard-song-panel" class="standard-song-display">
          <strong id="standard-song-title">カテゴリを選んでください</strong>
          <span id="standard-song-category">上のボタンから抽選できます</span>
        </div>
        <button id="standard-redraw-button" class="standard-redraw-button" type="button" disabled>もう一曲</button>
        <p class="standard-key-hint">Space / Enter でもう一曲</p>
      </section>

      <section class="standard-history" aria-labelledby="history-heading">
        <div class="standard-history-heading">
          <h2 id="history-heading">最近出た曲</h2><span>直近10曲</span>
        </div>
        <ol id="standard-history-list" class="standard-history-list">
          <li class="standard-history-empty">まだ履歴はありません</li>
        </ol>
      </section>
    </main>

    <script src="../src/jazz-standards.js?v=20260825-standard-random"></script>
    <script src="../src/standard-sight-reading.js?v=20260825-standard-random"></script>
  </body>
</html>
