<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="メジャーキーのルートレス2-5-1の構成音を答えるトレーニング" />
    <title>ルートレス2-5-1</title>
    <link rel="stylesheet" href="../styles.css?v=20260809-rootless251" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <nav class="hero-links" aria-label="ページ"><a href="../">ホーム</a></nav>
        <h1>ルートレス2-5-1</h1>
        <p>指定されたボイシング順で音名を答える</p>
      </header>
      <section class="settings chord-start" aria-label="開始">
        <button id="rootless-251-start-button" class="button primary" type="button">スタート</button>
      </section>
      <section class="practice" aria-label="出題">
        <div class="progress-row progress-count-only"><strong id="rootless-251-progress-count">0 / 12</strong></div>
        <div id="rootless-251-question-panel" class="question-panel rootless-251-panel" aria-live="polite">
          <div class="ready-state"><strong>待機中</strong></div>
        </div>
        <div class="practice-actions">
          <button id="rootless-251-reveal-button" class="button primary wide" type="button" disabled>答えを見る</button>
          <button id="rootless-251-next-button" class="button success wide" type="button" hidden>次へ</button>
        </div>
      </section>
    </main>
    <script src="../src/daily-progress.js?v=20260809-rootless251"></script>
    <script src="../src/rootless-251.js?v=20260809-rootless251"></script>
  </body>
</html>
